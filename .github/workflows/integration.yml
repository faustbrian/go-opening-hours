name: PostgreSQL integration

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 15, 16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opening_hours
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d opening_hours"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/opening_hours?sslmode=disable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: 1.26.5
          cache: false
      - run: go test -tags=integration -race -timeout=15m ./postgres
