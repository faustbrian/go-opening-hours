schema_version: 1
tool_version: v1.6.2
tool_checksums_sha256: 2a740a44fee468f042b4a66e086fc01a02d8d28877c9b1866e278102665b35ad
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: go-doc
      path: api/baseline.txt
      packages:
        - .
        - ./adapters/calendar
        - ./adapters/config
        - ./adapters/temporal
        - ./adapters/validation
        - ./adapters/wire
        - ./compile
        - ./encoding
        - ./openinghourscalendar
        - ./openinghoursconfig
        - ./openinghourstemporal
        - ./openinghoursvalidation
        - ./openinghourswire
        - ./postgres
operations:
  - module: .
    gate: test
    steps:
      - type: go-test
        packages: ["./..."]
        run: 'DST|Fold|Timezone|Overnight|Transition|Duration'
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: ["./..."]
        benchmark: "."
        budget: 100ms
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzParseJSON$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzTextAndSQLScan$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzRangeConstruction$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzLocalResolution$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzScheduleConstruction$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzCompositionAndBoundedSearch$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: ["./encoding"]
        fuzz: '^FuzzStructuredImports$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: ["./postgres"]
        fuzz: '^FuzzPGXJSONBCodec$'
        budget: 10000x
        timeout: 2m
